<h2>GPA是怎么算的?</h2>
<p>每个等级对应绩点:A = 4,B = 3,C = 2,D = 1,F = 0。把每门课的绩点乘以学分,相加后除以总学分。例:一门3学分的A和一门4学分的B,得 (4×3 + 3×4) ÷ 7 = 3.43。</p>

<script>
function showResult(id, txt, shareMsg) {
  var el = document.getElementById(id);
  el.style.display = "block";
  var content = txt;
  if (shareMsg) {
    var waLink = "https://wa.me/?text=" + encodeURIComponent(shareMsg + "\n" + location.href);
    content += '<a class="wa" target="_blank" href="' + waLink + '">把结果分享到WhatsApp</a>';
  }
  el.innerHTML = content;
}
function addRow(){
  var rows=document.getElementById("rows");
  var d=rows.children[0].cloneNode(true);
  d.querySelector("input").value="";
  rows.appendChild(d);
}
function calcGpa(){
  var rows=document.getElementById("rows").children;
  var pts=0,hrs=0;
  for(var i=0;i<rows.length;i++){
    var g=parseFloat(rows[i].querySelector("select").value);
    var h=parseFloat(rows[i].querySelector("input").value);
    if(!isNaN(h)&&h>0){pts+=g*h;hrs+=h;}
  }
  if(hrs<=0) return showResult("r9","请输入学分");
  var v=pts/hrs;
  showResult("r9","你的GPA:"+v.toFixed(2)+" / 4.0(共"+hrs+" 学分)","我的GPA "+v.toFixed(2)+" / 4");
}
</script>
