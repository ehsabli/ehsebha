<script>
function showResult(id, txt, shareMsg) {
  var el = document.getElementById(id);
  el.style.display = "block";
  var content = txt;
  if (shareMsg) {
    var waLink = "https://wa.me/?text=" + encodeURIComponent(shareMsg + "\n" + location.href);
    content += '<a class="wa" target="_blank" href="' + waLink + '">把结果分享到WhatsApp</a>';
  }
  el.innerHTML = content;
}
function calcDisc(){
  var pr=parseFloat(document.getElementById("pr").value);
  var di=parseFloat(document.getElementById("di").value);
  if(isNaN(pr)||isNaN(di)||pr<0||di<0||di>100) return showResult("r14","请检查数字");
  var save=pr*di/100, fin=pr-save;
  showResult("r14","折后价:"+fin.toFixed(2)+"<br>你省了:"+save.toFixed(2),"折后价 "+di+"%: "+fin.toFixed(2));
}
</script>
