<script>
function showResult(id, txt, shareMsg) {
  var el = document.getElementById(id);
  el.style.display = "block";
  var content = txt;
  if (shareMsg) {
    var waLink = "https://wa.me/?text=" + encodeURIComponent(shareMsg + "\n" + location.href);
    content += '<a class="wa" target="_blank" href="' + waLink + '">把结果分享到WhatsApp</a>';
  }
  el.innerHTML = content;
}
function calcDiff(){
  var f1=document.getElementById("f1").value,f2=document.getElementById("f2").value;
  if(!f1||!f2) return showResult("r12","请选择两个日期");
  var d=Math.abs(new Date(f2)-new Date(f1));
  var days=Math.round(d/86400000);
  var w=Math.floor(days/7),rd=days%7;
  showResult("r12","相差:"+days+" 天(合"+w+" 周零 "+rd+" 天)");
}
</script>
